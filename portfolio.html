  <script src="photos.js"></script>
  <script src="common.js"></script>
  <script>
    const grid = $("grid");
    const filtersEl = $("filters");
    let currentFilter = "all";

    // Read the category from the link, e.g. portfolio.html#travel
    function filterFromHash() {
      const key = decodeURIComponent(location.hash.replace(/^#/, ""));
      const known = GENRES.some(g => g[0] === key);
      return known && (key === "all" || getGenreCount(key) > 0) ? key : "all";
    }

    function initFilters() {
      filtersEl.innerHTML = "";
      GENRES.forEach(([key, name]) => {
        const count = getGenreCount(key);
        if (key !== "all" && count === 0) return;   // hide empty or hidden categories
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "filter-btn";
        btn.dataset.filter = key;
        btn.setAttribute("aria-pressed", key === currentFilter ? "true" : "false");
        btn.innerHTML = `<span>${esc(name)}</span><span class="filter-count">(${count})</span>`;
        btn.addEventListener("click", () => setFilter(key));
        filtersEl.appendChild(btn);
      });
    }

    function setFilter(key, skipHash) {
      currentFilter = key;
      filtersEl.querySelectorAll(".filter-btn").forEach(btn => {
        btn.setAttribute("aria-pressed", String(btn.dataset.filter === key));
      });
      if (!skipHash) {
        try {
          history.replaceState(null, "", key === "all" ? location.pathname + location.search : "#" + key);
        } catch (e) {}
      }
      renderGallery();
    }

    // Shuffle the photos once per visit, so every category looks mixed.
    // The order then holds while the visitor switches between filters.
    function shuffled(list) {
      const a = list.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
    const galleryOrder = shuffled(visiblePhotos());

    function renderGallery() {
      const items = galleryOrder.filter(p => currentFilter === "all" || p.cat === currentFilter);
      renderTiles(grid, items);
    }

    currentFilter = filterFromHash();
    initFilters();
    renderGallery();
    window.addEventListener("hashchange", () => setFilter(filterFromHash(), true));
  </script>
